version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_platform
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - DB_PATH=/app/data/credit_risk.duckdb
    restart: unless-stopped

  setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_setup
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - DB_PATH=/app/data/credit_risk.duckdb
    command: python setup_platform.py
    profiles:
      - setup
