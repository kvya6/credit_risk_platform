version: "3.9"

services:
  credit-risk-platform:
    build:
      context: ..
      dockerfile: ui_web/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATA_DIR=/app/data
      - MODEL_DIR=/app/models
      - DB_PATH=/app/data/credit_risk.duckdb
    restart: unless-stopped
